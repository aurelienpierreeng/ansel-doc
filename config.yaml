baseURL:  /
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
title: Ansel documentation
refLinksErrorLevel: WARNING

markup:
  goldmark:
    renderer:
      # Shortcodes and content both emit inline HTML the docs rely on: <kbd> for key
      # names (mandated by AGENTS.md), <br> inside table cells, and the <div> grids the
      # theme's row/column/gallery shortcodes produce. Goldmark's default (unsafe: false)
      # strips all of it and renders "<!-- raw HTML omitted -->" instead.
      unsafe: true
  highlight:
    style: algol_nu
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2

module:
  # Build the theme from the sibling ansel-website checkout rather than the module
  # published on GitHub, so theme edits show up here without a commit, push and
  # `hugo mod get -u`. Requires ansel-website to sit next to this repository; see
  # hugo.work. Drop this line (or set it to "off") to go back to the published module.
  workspace: hugo.work
  mounts:
  - disableWatch: false
    excludeFiles: null
    includeFiles: null
    lang: ""
    source: content
    target: content

languages:
  en:
    title: Ansel user manual
    languageName: English
    weight: 1
  fr:
    title: Ansel user manual
    languageName: Français
    weight: 2
  de:
    title: Ansel user manual
    languageName: German
    weight: 4
  eo:
    title: Ansel user manual
    languageName: Esperanto
    weight: 5
  es:
    title: Ansel user manual
    languageName: Español
    weight: 6
  it:
    title: Ansel user manual
    languageName: Italian
    weight: 8
  pl:
    title: Ansel user manual
    languageName: Polish
    weight: 9
  pt_br:
    title: manual do usuário Ansel
    languageName: Português
    weight: 10
  uk:
    title: Ansel user manual
    languageName: Ukrainian
    weight: 11
  nl:
    title: Ansel user manual
    languageName: Dutch
    weight: 12

outputs:
  home:
    - HTML
    - RSS
    - JSON

theme:
  - github.com/aurelienpierreeng/ansel-website/themes/ansel

ignoreFiles:
- \.svg$
- \.odg$
- \.xcf$

ignoreLogs:
- warning-goldmark-raw-html
